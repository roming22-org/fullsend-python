[project]
name = "fullsend-python"
version = "0.1.0"
description = "A demo Python application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
fullsend-python = "fullsend_python.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fullsend_python"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
