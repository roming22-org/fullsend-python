[project]
name = "demo"
version = "0.1.0"
description = "A demo Python application that prints Hello World"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
demo = "demo.main:main"

[build-system]
requires = ["hatchling"]
