agent: agents/haiku.md
image: ghcr.io/fullsend-ai/fullsend-sandbox:latest
policy: policies/base.yaml
providers:
  - vertex-ai
role: triage
slug: roming22-org-haiku

trigger: >
  event.transition.kind == "label_changed"
    && event.transition.label.name == "haiku"
    && event.transition.label.action == "added"

pre_script: scripts/pre-haiku.sh
post_script: scripts/post-haiku.sh

host_files:
  - src: env/gcp-vertex.env
    dest: /sandbox/workspace/.env.d/gcp-vertex.env
    expand: true
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/.gcp-credentials.json
  - src: ${GCP_OIDC_TOKEN_FILE}
    dest: /sandbox/workspace/.gcp-oidc-token
    optional: true
  - src: /tmp/haiku-input/cat.jpg
    dest: /sandbox/workspace/cat.jpg
    optional: true

timeout_minutes: 10

overlays:
  - when: 'runtime.forge == "github"'
    env:
      runner:
        GITHUB_ISSUE_URL: "${GITHUB_ISSUE_URL}"
        GH_TOKEN: "${GH_TOKEN}"
