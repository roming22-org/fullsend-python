# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See ADR 0033 for details.
version: "1"
roles:
    - triage
    - coder
    - review
    - fix
    - retro
    - prioritize
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
create_issues:
    allow_targets:
        repos:
            - roming22-org/fullsend-python
            - fullsend-ai/fullsend
agents:
    - name: haiku
      source: customized/harness/haiku.yaml
inference:
    project: it-gcp-tsd-rarnaud
    wif_provider: projects/733578211576/locations/global/workloadIdentityPools/fullsend-inference/providers/gh-roming22-org-fullsend-python
